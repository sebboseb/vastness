<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vastness — M1 threshold experiment</title>
<style>body{margin:0;background:#101719;color:#e0dfcc;font:13px monospace;overflow:hidden}canvas{width:100vw;height:100vh;display:block;outline:none}header,footer{position:fixed;left:14px;right:14px;background:#101719e8;padding:10px;z-index:2}header{top:12px;max-width:780px}footer{bottom:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,select{font:inherit;background:#243334;color:inherit;border:1px solid #586967;padding:7px;cursor:pointer}button:disabled{opacity:.4}p{margin:5px 0}#telemetry{font-size:11px}details{position:fixed;right:14px;top:12px;max-width:350px;background:#101719ee;z-index:3;padding:8px}pre{white-space:pre-wrap;font-size:11px;max-height:40vh;overflow:auto}.graphic{filter:url(#graphic-treatment)}#error{color:#ffb48c}</style></head><body>
<svg width="0" height="0" aria-hidden="true" style="position:absolute"><filter id="graphic-treatment" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="discrete" tableValues=".055 .12 .40 .83 .98"/><feFuncG type="discrete" tableValues=".085 .25 .50 .68 .88"/><feFuncB type="discrete" tableValues=".11 .28 .44 .42 .63"/></feComponentTransfer></filter></svg>
<canvas id="inspection-canvas" aria-label="Walkable generated chunk" tabindex="0"></canvas>
<header><strong>THRESHOLD FIELD · DISPOSABLE M1 EXPERIMENT</strong><p>Real TRELLIS asset × 3 · Authored floor and boundary · No M0 saves</p><p id="status">Loading verified geometry…</p><p id="telemetry"></p><p id="error" role="alert"></p></header>
<details><summary>Experiment evidence</summary><pre id="evidence">Waiting for geometry</pre><pre id="check-result">Walk check not run</pre></details>
<footer><label>Treatment <select id="variant"><option value="faceted">Faceted mineral</option><option value="graphic">Graphic splats</option><option value="glyph">Spatial glyphs</option><option value="original">Original splats · control</option></select></label>
<button id="enter" disabled>Walk · WASD + mouse</button><button id="reset">Reset view</button><button id="side">Side view</button><button id="back">Back view</button><button id="mode">Inspect one asset</button><button id="collider">Show collider</button><button id="forward">Walk forward</button><button id="stop">Stop</button><button id="tour">Walk circuit</button><button id="check">Run walk checks</button><span>Drag to look · arrows turn · Esc stops</span></footer>
<script type="module" src="/src/m1-prototype/main.ts"></script></body></html>
